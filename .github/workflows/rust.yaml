name: Bundled fork
on:
  push:
    branches: [main, codex/anybase-bundled]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bundled-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  bundled:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Test Cargo registry packaging and consumption
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Check DuckDB fork compatibility
        run: python3 scripts/check_fork_compat.py
      - run: cargo fmt --all -- --check
      - run: cargo build --release --locked -p duckdb --features bundled
      - run: cargo run --release --locked -p duckdb --example fork_smoke --features bundled
      - run: cargo test --release --locked -p libduckdb-sys --features bundled
      - name: Check native exception handling
        run: cargo test --release --locked -p duckdb --lib --features bundled test_native_csv_exception_returns_error -- --nocapture
      - run: cargo test --release --locked -p duckdb --lib --features bundled
      - name: Test upstream timestamp compatibility fix
        run: cargo test --release --locked -p duckdb --lib --features "bundled chrono" test_naive_date_time_before_epoch
      - name: Package Rust crates
        run: cargo package --locked --no-verify -p libduckdb-sys -p duckdb-loadable-macros -p duckdb
      - name: Package complete source workspace
        run: git archive --format=tar.gz --prefix=duckdb-rs-anybase/ --output=target/package/duckdb-rs-anybase-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-rs-fork-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/package/*.crate
            target/package/*-source.tar.gz
            target/release/examples/fork_smoke
            target/release/examples/fork_smoke.exe
            crates/libduckdb-sys/duckdb-fork.json
            crates/libduckdb-sys/duckdb.tar.gz.sha256
