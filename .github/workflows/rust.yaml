name: Bundled fork
on:
  push:
    branches: [main, codex/anybase-bundled]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundled:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check bundle checksum
        shell: bash
        run: python3 -c "import hashlib,pathlib; p=pathlib.Path('crates/libduckdb-sys/duckdb.tar.gz'); assert hashlib.sha256(p.read_bytes()).hexdigest() == pathlib.Path(str(p)+'.sha256').read_text().split()[0]"
      - run: cargo fmt --all -- --check
      - run: cargo build --release --locked -p duckdb --features bundled
      - run: cargo run --release --locked -p duckdb --example fork_smoke --features bundled
      - run: cargo test --release --locked -p libduckdb-sys --features bundled
      - run: cargo test --release --locked -p duckdb --lib --features bundled
      - name: Package Rust crates
        run: cargo package --locked --no-verify -p libduckdb-sys -p duckdb-loadable-macros -p duckdb
      - name: Package complete source workspace
        run: git archive --format=tar.gz --prefix=duckdb-rs-anybase/ --output=target/package/duckdb-rs-anybase-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-rs-fork-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/package/*.crate
            target/package/*-source.tar.gz
            target/release/examples/fork_smoke
            target/release/examples/fork_smoke.exe
            crates/libduckdb-sys/duckdb-fork.json
            crates/libduckdb-sys/duckdb.tar.gz.sha256
